# One-click Render deploy for the Nimbus2000 detection backend (ONNX Runtime).
# The frontend (Vercel) uploads flight ZIPs directly to this service.
services:
  - type: web
    name: nimbus2000-backend
    runtime: python
    # ONNX Runtime keeps memory ~350MB, so the FREE tier works (no card needed).
    # It sleeps after ~15min idle and cold-starts (~40s) on the next request.
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: ALLOWED_ORIGINS
        value: "*"           # tighten to your Vercel URL in production
      - key: MODEL_PATH
        value: models/best.onnx
